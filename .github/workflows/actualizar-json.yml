name: Generar JSON

on:
  push:
    paths:
      - 'excels/**'
      - 'scripts/**'

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node scripts/generar-json.js

      - name: Commit data.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data.json

          git diff --cached --quiet || git commit -m "Actualizar data.json"

          git push
